
name: 쭝터기 디스코드 업데이트 공지

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 디스코드에 업데이트 공지
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_JSON: ${{ toJSON(github.event.release) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ.get("WEBHOOK_URL", "")
          if not webhook:
              raise RuntimeError("DISCORD_WEBHOOK_URL 비밀값이 없습니다.")

          event = os.environ["EVENT_NAME"]

          if event == "workflow_dispatch":
              title = "🧪 쭝터기 디스코드 연동 테스트"
              description = (
                  "GitHub Actions와 디스코드 웹후크가 "
                  "정상적으로 연결되었습니다."
              )
              url = "https://github.com/sunwoqdno/jjungteogi-updates/releases"
          else:
              release = json.loads(os.environ["RELEASE_JSON"])
              version = release["tag_name"]
              title = f"🚀 쭝터기 {version} 업데이트"
              description = (
                  release.get("body")
                  or "새로운 업데이트가 배포되었습니다."
              )[:3500]
              url = release["html_url"]

          payload = {
              "username": "쭝터기 업데이트",
              "embeds": [{
                  "title": title,
                  "description": description,
                  "url": url,
                  "color": 5793266,
                  "fields": [{
                      "name": "📥 다운로드",
                      "value": f"[GitHub 릴리스 페이지]({url})"
                  }],
                  "footer": {
                      "text": "쭝터기 | AION2 PvP TOOL"
                  }
              }]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              print("디스코드 전송 성공:", response.status)
          PY
