
name: 쭝터기 디스코드 업데이트 공지

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 디스코드에 업데이트 공지
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_JSON: ${{ toJSON(github.event.release) }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 비밀값이 없습니다."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import urllib.request

          release = json.loads(os.environ["RELEASE_JSON"])
          version = release["tag_name"]
          url = release["html_url"]
          body = release.get("body") or "변경사항은 다운로드 페이지에서 확인해 주세요."

          message = {
              "username": "쭝터기 업데이트",
              "embeds": [{
                  "title": f"🚀 쭝터기 {version} 업데이트",
                  "url": url,
                  "description": body[:3500],
                  "color": 5793266,
                  "fields": [{
                      "name": "📥 다운로드",
                      "value": f"[GitHub에서 다운로드]({url})"
                  }],
                  "footer": {
                      "text": "쭝터기 | AION2 PvP TOOL"
                  }
              }]
          }

          data = json.dumps(message).encode("utf-8")
          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as res:
              print("디스코드 공지 전송:", res.status)
          PY
